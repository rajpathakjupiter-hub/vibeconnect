workflows:
  customer-android:
    name: VibeConnect Customer APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    
    environment:
      vars:
        EXPO_PUBLIC_API_URL: "http://193.181.209.130"
        PACKAGE_NAME: "com.vibeconnect.customer"
        KEY_ALIAS: "vibeconnect"
        KEY_PASSWORD: "Vibe@2024"
        STORE_PASSWORD: "Vibe@2024"
      node: 20
      java: 17
    
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - node_modules
    
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      
      - name: Set environment
        script: |
          echo "EXPO_PUBLIC_API_URL=http://193.181.209.130" > .env
      
      - name: Setup Android SDK
        script: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;27.1.12297006" || sdkmanager "ndk;26.1.10909125" || echo "Using default NDK"
      
      - name: Prebuild Android
        script: |
          npx expo prebuild --platform android --clean
      
      - name: Fix Kotlin compatibility
        script: |
          # macOS sed requires -i '' (empty backup extension)
          
          # Fix 1: React Native version catalog (ROOT CAUSE of Kotlin version)
          find node_modules/react-native -name "libs.versions.toml" | while read f; do
            echo "Fixing: $f"
            sed -i '' "s/1\.9\.24/1.9.25/g" "$f"
            grep -i kotlin "$f" | head -3
          done
          
          # Fix 2: expo-modules-core - add 1.9.25 mapping (keep 1.9.24 mapping too)
          EXPO_PLUGIN="node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle"
          EXPO_BUILD="node_modules/expo-modules-core/android/build.gradle"
          if [ -f "$EXPO_PLUGIN" ]; then
            sed -i '' 's/"1.9.24": "1.9.24-1.0.20"/"1.9.24": "1.9.24-1.0.20", "1.9.25": "1.9.25-1.0.20"/g' "$EXPO_PLUGIN"
            echo "Patched ExpoModulesCorePlugin.gradle"
          fi
          if [ -f "$EXPO_BUILD" ]; then
            sed -i '' 's/"1.9.24": "1.5.14"/"1.9.24": "1.5.14", "1.9.25": "1.5.15"/g' "$EXPO_BUILD"
            echo "Patched expo-modules-core build.gradle"
          fi
          
          # Fix 3: android/ folder
          find android -type f \( -name "*.gradle" -o -name "*.toml" -o -name "*.properties" \) | while read f; do
            sed -i '' "s/1\.9\.24/1.9.25/g" "$f" 2>/dev/null
          done
          echo "android.kotlinVersion=1.9.25" >> android/gradle.properties
          
          # VERIFY
          echo "=== VERIFY ==="
          grep -r "kotlin" node_modules/react-native/gradle/libs.versions.toml 2>/dev/null | head -3
          echo "DONE!"
      
      - name: Generate release keystore
        script: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore android/app/vibeconnect-release.keystore \
            -alias $KEY_ALIAS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass $STORE_PASSWORD \
            -keypass $KEY_PASSWORD \
            -dname "CN=VibeConnect, OU=Mobile, O=VibeConnect, L=India, ST=India, C=IN"
      
      - name: Configure release signing
        script: |
          python3 <<'PYEOF'
          import os, re
          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r") as f:
              content = f.read()
          store_pass = os.environ.get("STORE_PASSWORD", "Vibe@2024")
          key_alias = os.environ.get("KEY_ALIAS", "vibeconnect")
          key_pass = os.environ.get("KEY_PASSWORD", "Vibe@2024")
          release_config = f'''
            release {{
                storeFile file("vibeconnect-release.keystore")
                storePassword "{store_pass}"
                keyAlias "{key_alias}"
                keyPassword "{key_pass}"
            }}'''
          pattern = r'(signingConfigs\s*\{[^}]*debug\s*\{[^}]*\})'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              insert_pos = match.end()
              content = content[:insert_pos] + release_config + content[insert_pos:]
          content = content.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
          with open(gradle_path, "w") as f:
              f.write(content)
          print("Release signing configured!")
          PYEOF
      
      - name: Build Release APK
        script: |
          cd android
          ./gradlew app:assembleRelease -x lint --no-daemon
    
    artifacts:
      - android/app/build/outputs/**/*.apk
    
    publishing:
      email:
        recipients:
          - support@pay2hub.in
        notify:
          success: true
          failure: true

  host-android:
    name: VibeConnect Host APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    
    environment:
      vars:
        EXPO_PUBLIC_API_URL: "http://193.181.209.130"
      node: 20
      java: 17
    
    scripts:
      - name: Placeholder
        script: |
          echo "Host app workflow - coming soon"
