workflows:
  customer-android:
    name: VibeConnect Customer APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    
    environment:
      vars:
        EXPO_PUBLIC_API_URL: "http://193.181.209.130"
        PACKAGE_NAME: "com.vibeconnect.customer"
        KEY_ALIAS: "vibeconnect"
        KEY_PASSWORD: "Vibe@2024"
        STORE_PASSWORD: "Vibe@2024"
      node: 20
      java: 17
    
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - node_modules
    
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      
      - name: Set environment
        script: |
          echo "EXPO_PUBLIC_API_URL=http://193.181.209.130" > .env
      
      - name: Setup Android SDK
        script: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;27.1.12297006" || sdkmanager "ndk;26.1.10909125" || echo "Using default NDK"
      
      - name: Prebuild Android
        script: |
          npx expo prebuild --platform android --clean
      
      - name: Fix Kotlin compatibility
        script: |
          python3 << 'PYEOF'
          import glob, os
          
          count = 0
          # Replace 1.9.24 -> 1.9.25 in ALL relevant files
          patterns = [
              'node_modules/react-native/**/libs.versions.toml',
              'node_modules/expo-modules-core/android/*.gradle',
              'node_modules/expo-modules-core/android/*.gradle.kts',
              'android/**/*.gradle',
              'android/**/*.properties',
              'android/**/*.toml',
          ]
          for pattern in patterns:
              for fpath in glob.glob(pattern, recursive=True):
                  with open(fpath, 'r') as f:
                      content = f.read()
                  if '1.9.24' in content:
                      new_content = content.replace('1.9.24', '1.9.25')
                      with open(fpath, 'w') as f:
                          f.write(new_content)
                      count += 1
                      print(f'FIXED: {fpath}')
          
          # Also add to gradle.properties
          gp = 'android/gradle.properties'
          with open(gp, 'a') as f:
              f.write('\nandroid.kotlinVersion=1.9.25\n')
          
          # Verify
          print(f'\nTotal files fixed: {count}')
          for pattern in patterns:
              for fpath in glob.glob(pattern, recursive=True):
                  with open(fpath) as f:
                      if '1.9.24' in f.read():
                          print(f'WARNING STILL HAS 1.9.24: {fpath}')
          print('VERIFICATION COMPLETE')
          PYEOF
      
      - name: Generate release keystore
        script: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore android/app/vibeconnect-release.keystore \
            -alias $KEY_ALIAS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass $STORE_PASSWORD \
            -keypass $KEY_PASSWORD \
            -dname "CN=VibeConnect, OU=Mobile, O=VibeConnect, L=India, ST=India, C=IN"
      
      - name: Configure release signing
        script: |
          python3 <<'PYEOF'
          import os, re
          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r") as f:
              content = f.read()
          store_pass = os.environ.get("STORE_PASSWORD", "Vibe@2024")
          key_alias = os.environ.get("KEY_ALIAS", "vibeconnect")
          key_pass = os.environ.get("KEY_PASSWORD", "Vibe@2024")
          release_config = f'''
            release {{
                storeFile file("vibeconnect-release.keystore")
                storePassword "{store_pass}"
                keyAlias "{key_alias}"
                keyPassword "{key_pass}"
            }}'''
          pattern = r'(signingConfigs\s*\{[^}]*debug\s*\{[^}]*\})'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              insert_pos = match.end()
              content = content[:insert_pos] + release_config + content[insert_pos:]
          content = content.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
          with open(gradle_path, "w") as f:
              f.write(content)
          print("Release signing configured!")
          PYEOF
      
      - name: Build Release APK
        script: |
          cd android
          ./gradlew app:assembleRelease -x lint --no-daemon
    
    artifacts:
      - android/app/build/outputs/**/*.apk
    
    publishing:
      email:
        recipients:
          - support@pay2hub.in
        notify:
          success: true
          failure: true

  host-android:
    name: VibeConnect Host APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    
    environment:
      vars:
        EXPO_PUBLIC_API_URL: "http://193.181.209.130"
      node: 20
      java: 17
    
    scripts:
      - name: Placeholder
        script: |
          echo "Host app workflow - coming soon"
